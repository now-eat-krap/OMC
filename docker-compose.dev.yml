# =============================================================================
# Docker Compose 개발 환경 설정 (오버라이드)
# =============================================================================
#
# 사용법:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 개발 환경 특징:
#   - 소스 코드 볼륨 마운트 (핫 리로드)
#   - uvicorn --reload 모드
#   - DEBUG 환경변수 활성화
#
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Backend - 개발 모드 (핫 리로드)
  # ===========================================================================
  backend:
    volumes:
      # 소스 코드 마운트 (핫 리로드용)
      - ./backend:/app
      - numba_cache:/app/.numba_cache
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    # uvicorn 핫 리로드 모드
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ===========================================================================
  # RQ Worker - 개발 모드
  # ===========================================================================
  rq-worker:
    volumes:
      # 소스 코드 마운트
      - ./backend:/app
      - numba_cache:/app/.numba_cache
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # ===========================================================================
  # RQ Cron - 개발 모드
  # ===========================================================================
  rq-cron:
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

# =============================================================================
# 볼륨은 base 파일(docker-compose.yml)에서 정의됨
# =============================================================================
