# =============================================================================
# Grafana 대시보드 자동 프로비저닝 설정
# =============================================================================
# Grafana 시작 시 대시보드 JSON 파일 자동 로드
# =============================================================================

apiVersion: 1

providers:
  # ---------------------------------------------------------------------------
  # 로컬 대시보드 폴더
  # ---------------------------------------------------------------------------
  - name: "default"
    orgId: 1
    folder: ""
    folderUid: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
