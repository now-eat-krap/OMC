# =============================================================================
# Nginx 설정 파일
# React SPA + Backend API 리버스 프록시 + SSL (Cloudflare Full Strict)
# =============================================================================

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name one-more-coin.com www.one-more-coin.com;
    
    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    return 301 https://$host$request_uri;
}

# HTTPS 서버
server {
    listen 443 ssl;
    server_name one-more-coin.com www.one-more-coin.com;
    
    # -------------------------------------------------------------------------
    # SSL 인증서 설정 (Cloudflare Origin Certificate)
    # -------------------------------------------------------------------------
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 루트 디렉토리 (React 빌드 결과물)
    root /usr/share/nginx/html;
    index index.html;
    
    # -------------------------------------------------------------------------
    # 정적 파일 캐싱 설정
    # -------------------------------------------------------------------------
    # JS, CSS, 이미지 등 정적 파일은 1년간 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # -------------------------------------------------------------------------
    # API 리버스 프록시
    # -------------------------------------------------------------------------
    # /api/* 요청을 Backend 서버로 전달 (/api prefix 유지)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        
        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 지원 (필요시)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 타임아웃 설정 (백테스트가 오래 걸릴 수 있음)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # -------------------------------------------------------------------------
    # React SPA 라우팅
    # -------------------------------------------------------------------------
    # 모든 경로를 index.html로 리다이렉트 (React Router 지원)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # -------------------------------------------------------------------------
    # Gzip 압축
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/rss+xml application/atom+xml image/svg+xml;
    
    # -------------------------------------------------------------------------
    # 보안 헤더
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
