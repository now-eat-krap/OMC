# =============================================================================
# Docker Compose 설정 파일 (공통 베이스)
# 백테스팅 서비스: Frontend(Nginx) + Backend(FastAPI) + Redis + Celery
# =============================================================================
#
# 사용법:
#   개발 환경:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   프로덕션:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   중지:       docker-compose down
#   로그 확인:  docker-compose logs -f [서비스명]
#
# =============================================================================

version: "3.8"

# =============================================================================
# 공통 환경변수 정의 (x-로 시작하는 앵커)
# =============================================================================
x-common-env: &common-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD:-} # 비밀번호 (없으면 인증 없이 연결)
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
  NUMBA_CACHE_DIR: /app/.numba_cache

services:
  # ===========================================================================
  # Redis - 캔들 데이터 캐시 서버
  # ===========================================================================
  # 15분봉 데이터를 캐시하여 백테스트 속도 향상
  # 데이터 영속성: AOF(Append Only File) 모드로 재시작 시에도 데이터 유지
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: backtesting-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes                       
      --maxmemory 512mb                      
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD:-} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backtesting-network

  # ===========================================================================
  # Backend - FastAPI 백테스트 API 서버
  # ===========================================================================
  # VectorBT 기반 백테스트 엔진
  # Redis 캐시 연동으로 빠른 데이터 조회
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtesting-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - numba_cache:/app/.numba_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backtesting-network

  # ===========================================================================
  # RQ Worker - 백테스트 작업 처리
  # ===========================================================================
  # 백그라운드에서 백테스트 작업을 처리하는 Worker
  # ===========================================================================
  rq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtesting-rq-worker
    restart: unless-stopped
    command: rq worker backtest --url redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0 --with-scheduler
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - numba_cache:/app/.numba_cache
    networks:
      - backtesting-network

  # ===========================================================================
  # Frontend - Nginx 기반 React SPA
  # ===========================================================================
  # Vite로 빌드된 정적 파일을 Nginx로 서빙
  # API 요청은 Backend로 리버스 프록시
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backtesting-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backtesting-network

# =============================================================================
# 네트워크 정의
# =============================================================================
networks:
  backtesting-network:
    driver: bridge
    name: backtesting-network

# =============================================================================
# 볼륨 정의
# =============================================================================
volumes:
  redis_data:
    driver: local
    name: backtesting-redis-data

  numba_cache:
    driver: local
    name: backtesting-numba-cache
