# Python 프로젝트 설정
[project]
name = "backtesting-backend"
version = "1.0.0"
requires-python = ">=3.10"

# Ruff 설정 (Python linter + formatter)
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".numba_cache",
]

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# I: isort (import sorting)
# W: pycodestyle warnings
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    "E501",  # line too long (formatter handles this)
    "B008",  # function call in default argument (FastAPI Depends)
    "B905",  # zip without strict= (safe for equal-length iterables)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
