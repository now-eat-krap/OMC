# =============================================================================
# Docker Compose 설정 파일
# 백테스팅 서비스: Frontend(Nginx) + Backend(FastAPI) + Redis
# =============================================================================
#
# 사용법:
#   개발 환경:  docker-compose up -d
#   프로덕션:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   중지:       docker-compose down
#   로그 확인:  docker-compose logs -f [서비스명]
#
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # Redis - 캔들 데이터 캐시 서버
  # ===========================================================================
  # 15분봉 데이터를 캐시하여 백테스트 속도 향상
  # 데이터 영속성: AOF(Append Only File) 모드로 재시작 시에도 데이터 유지
  # ===========================================================================
  redis:
    image: redis:7-alpine # 경량 Alpine 기반 Redis 7
    container_name: backtesting-redis
    restart: unless-stopped # 수동 중지 전까지 자동 재시작
    ports:
      - "6379:6379" # Redis 기본 포트
    volumes:
      - redis_data:/data # 데이터 영속성을 위한 볼륨
    command: >
      redis-server 
      --appendonly yes                       
      --maxmemory 512mb                      
      --maxmemory-policy allkeys-lru
    # --appendonly yes: AOF 모드로 데이터 영속성 보장
    # --maxmemory 512mb: 최대 메모리 제한 (필요시 조정)
    # --maxmemory-policy allkeys-lru: 메모리 초과 시 가장 오래된 키 삭제
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Redis 헬스체크
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend - FastAPI 백테스트 API 서버
  # ===========================================================================
  # VectorBT 기반 백테스트 엔진
  # Redis 캐시 연동으로 빠른 데이터 조회
  # ===========================================================================
  backend:
    build:
      context: ./backend # backend 폴더를 빌드 컨텍스트로
      dockerfile: Dockerfile # Dockerfile 경로
    container_name: backtesting-backend
    restart: unless-stopped
    ports:
      - "8000:8000" # FastAPI 기본 포트
    environment:
      # Redis 연결 설정
      - REDIS_HOST=redis # Docker 내부 네트워크에서 서비스명으로 접근
      - REDIS_PORT=6379
      - REDIS_DB=0
      # OpenAI API 설정 (AI 전략 생성용)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Python 환경 설정
      - PYTHONUNBUFFERED=1 # 로그 버퍼링 비활성화 (실시간 로그)
      - PYTHONDONTWRITEBYTECODE=1 # .pyc 파일 생성 방지
      # Numba JIT 캐시 설정 (컨테이너 재시작 후에도 캐시 유지)
      - NUMBA_CACHE_DIR=/app/.numba_cache
    depends_on:
      redis:
        condition: service_healthy # Redis가 정상 동작할 때까지 대기
    volumes:
      # 개발 모드: 소스 코드 마운트 (핫 리로드용)
      # 프로덕션에서는 이 줄을 제거하거나 주석 처리
      - ./backend:/app
      # Numba JIT 캐시 볼륨 (컨테이너 재시작 후에도 JIT 컴파일 캐시 유지)
      - numba_cache:/app/.numba_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Celery Worker - 백테스트 작업 처리
  # ===========================================================================
  # 백그라운드에서 백테스트 작업을 처리하는 Worker
  # N100 환경에서는 concurrency=1~2 권장
  # ===========================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtesting-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      # Redis 연결 설정
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Python 환경 설정
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Numba JIT 캐시 설정
      - NUMBA_CACHE_DIR=/app/.numba_cache
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - numba_cache:/app/.numba_cache

  # ===========================================================================
  # Frontend - Nginx 기반 React SPA
  # ===========================================================================
  # Vite로 빌드된 정적 파일을 Nginx로 서빙
  # API 요청은 Backend로 리버스 프록시
  # ===========================================================================
  frontend:
    build:
      context: ./frontend # frontend 폴더를 빌드 컨텍스트로
      dockerfile: Dockerfile # Dockerfile 경로
    container_name: backtesting-frontend
    restart: unless-stopped
    ports:
      - "80:80" # HTTP 기본 포트
      # - "443:443"                          # HTTPS (SSL 인증서 설정 후 활성화)
    depends_on:
      - backend # Backend가 먼저 시작되어야 함
    # Nginx 설정 파일 마운트 (커스텀 설정 필요시)
    # volumes:
    #   - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

# =============================================================================
# 도커 볼륨 정의
# =============================================================================
# 컨테이너가 삭제되어도 데이터 유지
# =============================================================================
volumes:
  redis_data:
    driver: local # 로컬 볼륨 드라이버 사용
    name: backtesting-redis-data # 볼륨 이름 명시적 지정

  # Numba JIT 컴파일 캐시 볼륨
  # VectorBT의 Numba JIT 컴파일 결과를 캐시하여 초기 실행 속도 향상
  numba_cache:
    driver: local
    name: backtesting-numba-cache
# =============================================================================
# 도커 네트워크 (기본 bridge 네트워크 사용)
# =============================================================================
# 모든 서비스가 같은 네트워크에서 서비스명으로 통신 가능
# 예: backend에서 redis 접근 시 "redis:6379"
# =============================================================================
