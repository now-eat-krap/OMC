# ==============================================================================
# Gemini Code Assist Configuration
# 현업 수준의 PR 코드 리뷰 설정
# https://cloud.google.com/gemini/docs/code-assist/customize-code-review
# ==============================================================================

version: 1

# ------------------------------------------------------------------------------
# PR 열릴 때 자동 동작
# ------------------------------------------------------------------------------
pull_request_opened:
  # PR 요약 자동 생성 (변경 사항을 한눈에 파악)
  summary: true

  # 코드 리뷰 자동 실행
  code_review: true

# ------------------------------------------------------------------------------
# 코드 리뷰 설정
# ------------------------------------------------------------------------------
code_review:
  # 코드 리뷰 활성화 (false로 설정하면 비활성화)
  disable: false

  # 코멘트 심각도 임계값
  # LOW: 모든 이슈 표시 (노이즈 많음)
  # MEDIUM: 중간 이상 (권장 - 균형 잡힌 리뷰)
  # HIGH: 중요한 이슈만
  # CRITICAL: 심각한 버그/보안 이슈만
  comment_severity_threshold: MEDIUM

  # 최대 리뷰 코멘트 수 (-1 = 무제한)
  # 너무 많으면 리뷰어가 압도당할 수 있음
  max_review_comments: 25

# ------------------------------------------------------------------------------
# 리뷰 코멘트 심각도 필터
# 아래 레벨들만 리뷰에 포함
# ------------------------------------------------------------------------------
review_comment_severity:
  - critical # 심각한 버그, 보안 취약점
  - high # 중요한 로직 오류, 성능 이슈
  - medium # 코드 품질, 베스트 프랙티스
  # - low       # 스타일, 사소한 제안 (주석 처리로 제외)

# ------------------------------------------------------------------------------
# 무시할 파일/폴더 (glob 패턴)
# 리뷰할 필요 없는 파일들을 제외하여 노이즈 감소
# ------------------------------------------------------------------------------
ignore:
  # === Dependencies ===
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/.tox/**"

  # === Build Outputs ===
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/out/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.numba_cache/**"

  # === Lock Files (자동 생성됨) ===
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
  - "**/yarn.lock"
  - "**/poetry.lock"
  - "**/Pipfile.lock"

  # === Minified/Bundled Files ===
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/*.bundle.js"
  - "**/*.chunk.js"

  # === Generated/Auto Files ===
  - "**/*.generated.*"
  - "**/*.auto.*"
  - "**/coverage/**"
  - "**/.coverage"
  - "**/htmlcov/**"

  # === IDE/Editor ===
  - "**/.idea/**"
  - "**/.vscode/**"
  - "**/*.swp"
  - "**/*.swo"

  # === Logs ===
  - "**/*.log"
  - "**/logs/**"

  # === Assets (이미지, 폰트 등) ===
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.ico"
  - "**/*.svg"
  - "**/*.woff"
  - "**/*.woff2"
  - "**/*.ttf"
  - "**/*.eot"
# ------------------------------------------------------------------------------
# 추가 설정 (Enterprise 기능)
# ------------------------------------------------------------------------------
# improve_response_quality: false  # 응답 품질 개선 (데이터 수집 동의 필요)
