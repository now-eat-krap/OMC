# =============================================================================
# Prometheus 설정 파일
# =============================================================================
# 백테스팅 서비스 메트릭 수집 설정
# FastAPI, Redis, cAdvisor에서 메트릭 스크래핑
# =============================================================================

global:
  # 스크래핑 간격 (15초)
  scrape_interval: 15s
  # 평가 간격 (알림 규칙 등)
  evaluation_interval: 15s
  # 외부 라벨 (Alertmanager 등으로 전송 시 사용)
  external_labels:
    monitor: "backtesting-monitor"

# =============================================================================
# 스크래핑 대상 설정
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus 자체 메트릭
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # FastAPI 백엔드 메트릭
  # ---------------------------------------------------------------------------
  # prometheus-fastapi-instrumentator가 노출하는 /metrics 엔드포인트
  - job_name: "fastapi"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ---------------------------------------------------------------------------
  # Redis Exporter 메트릭
  # ---------------------------------------------------------------------------
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # cAdvisor 컨테이너 메트릭
  # ---------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics
    scrape_interval: 30s
